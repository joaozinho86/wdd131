<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Segurança em Foco</title>
  <link rel="stylesheet" href="estilos/seguranca.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <h1>Segurança em Foco</h1>
  </header>

  <!-- Imagem pequena (visualização móvel) -->
  <section class="imagem-pequena">
    <img src="img/placeholder-small.png" alt="Imagem pequena ilustrativa">
  </section>

  <!-- Seção de Dados -->
  <section class="dados">
    <h2>Dados</h2>
    <p><strong>Norma:</strong> NR-6</p>
    <p><strong>Descrição:</strong> Equipamentos de Proteção Individual</p>
    <p><strong>Status:</strong> Obrigatório</p>
  </section>

  <!-- Seção de Clima -->
  <section class="clima">
    <h2>Clima</h2>
    <p><strong>Temperatura:</strong> 25°C</p>
    <p><strong>Umidade:</strong> 60%</p>
    <img src="img/placeholder-weather.png" alt="Ícone de clima">
  </section>

  <!-- Rodapé -->
  <footer>
    <p>© 2026 Segurança em Foco • Sant’Ana do Livramento • Última modificação: 28/07/2026</p>
  </footer>

</body>
</html>
